name: Run Breakout Screener

on:
  schedule:
    - cron: '30 12 * * *'     # Daily at 6 PM IST
    - cron: '30 13 * * 6'     # Saturday at 7 PM IST
    - cron: '30 14 28-31 * *' # Last few days of month at 8 PM IST
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run screener
      run: |
        jupyter nbconvert --to notebook --execute breakout_screener.ipynb --output breakout_screener_output.ipynb
